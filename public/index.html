<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AtlasWarfare - Dünyayı Fethet</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #ff6b00; 
            --secondary: #00d4ff; 
            --dark: #0a0a0a; 
            --panel: rgba(15, 15, 20, 0.95); 
            --panel-border: rgba(255, 107, 0, 0.3); 
            --gold: #ffd700; 
            --red: #ff3333; 
            --green: #00cc44; 
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Rajdhani', sans-serif; background: #0c0e0a; color: white; overflow: hidden; user-select: none; }

        /* GİRİŞ EKRANI */
        #auth-screen { display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a0a 70%); position: relative; z-index: 100; }
        #auth-screen::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: url('https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=1920') no-repeat center; background-size: cover; opacity: 0.15; filter: blur(2px); }
        .auth-box { background: var(--panel); border: 2px solid var(--panel-border); border-radius: 12px; padding: 40px; width: 420px; box-shadow: 0 0 50px rgba(255, 107, 0, 0.2); text-align: center; position: relative; z-index: 1; backdrop-filter: blur(15px); animation: scaleIn 0.5s; }
        .game-title { font-family: 'Cinzel', serif; font-size: 2.8rem; font-weight: 900; background: linear-gradient(45deg, var(--primary), var(--gold), var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 30px rgba(255, 107, 0, 0.5); margin-bottom: 5px; letter-spacing: 3px; }
        .game-subtitle { color: var(--secondary); font-size: 0.9rem; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 4px; opacity: 0.8; }
        .auth-input { width: 100%; padding: 12px 15px; margin: 8px 0; background: rgba(0,0,0,0.6); border: 1px solid #333; border-radius: 6px; color: white; font-family: 'Rajdhani'; font-size: 1.05rem; outline: none; transition: 0.3s; }
        .auth-input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(255,107,0,0.3); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; color: white; font-weight: 700; font-size: 1.05rem; cursor: pointer; margin-top: 8px; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; font-family: 'Rajdhani'; }
        .btn-primary { background: linear-gradient(45deg, var(--primary), #cc5500); border: 1px solid var(--gold); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,107,0,0.4); }
        .btn-secondary { background: transparent; border: 1px solid var(--secondary); color: var(--secondary); }
        .btn-secondary:hover { background: rgba(0,212,255,0.1); }
        .error-msg { color: var(--red); margin-top: 8px; font-weight: 600; display: none; }
        .success-msg { color: var(--green); margin-top: 8px; font-weight: 600; display: none; }

        /* KARAKTER SEÇİM */
        #char-select-screen { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at center, #1a1a2e, #000); z-index: 80; justify-content: center; align-items: center; padding: 20px; overflow-y: auto; }
        .char-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; max-width: 900px; }
        .char-card { background: var(--panel); border: 2px solid #333; border-radius: 10px; padding: 15px; cursor: pointer; transition: 0.3s; text-align: center; }
        .char-card:hover { border-color: var(--primary); transform: translateY(-5px); box-shadow: 0 10px 30px rgba(255,107,0,0.3); }
        .char-card.selected { border-color: var(--gold); background: rgba(255,215,0,0.1); box-shadow: 0 0 20px var(--gold); }
        .char-icon { font-size: 3rem; margin-bottom: 8px; }
        .char-name { font-family: 'Cinzel'; font-size: 0.95rem; color: var(--primary); margin-bottom: 5px; }
        .color-grid { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin: 20px 0; }
        .color-swatch { width: 50px; height: 50px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: 0.3s; }
        .color-swatch:hover { transform: scale(1.1); }
        .color-swatch.selected { border-color: white; box-shadow: 0 0 20px currentColor; }

        /* OYUN EKRANI */
        #game-screen { display: none; height: 100vh; width: 100vw; position: relative; background: #111; }

        /* ============ GERÇEK 3D ŞEHİR HARİTASI (WebGL / Three.js) ============ */
        #map-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; 
            background: #171308;
            cursor: grab;
            touch-action: none;
        }
        #map-container.grabbing { cursor: grabbing; }
        #map-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; outline: none; }
        #css2d-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; z-index: 5; }

        /* Sinematik gün batımı ışığı: WebGL sahnesinin üstünde ince bir renk/atmosfer katmanı.
           3D sahnenin kendi ışıklandırması (yönlü sıcak ışık + hemisfer + sis) zaten gerçek derinlik
           üretiyor; bu katman sadece ekran-uzayında hafif bir "golden hour" rötuşu ekliyor. */
        #golden-hour-overlay {
            position: absolute; inset: 0; pointer-events: none; z-index: 8;
            background:
                radial-gradient(ellipse at 18% 12%, rgba(255,178,90,0.16) 0%, transparent 45%),
                linear-gradient(150deg, rgba(255,140,60,0.07) 0%, transparent 35%, rgba(20,10,30,0.22) 100%);
            mix-blend-mode: overlay;
        }

        .iso-label { 
            background: rgba(10,10,8,0.88); 
            padding: 2px 9px; border-radius: 4px; 
            font-size: 0.72rem; font-weight: 700; white-space: nowrap; 
            border: 1px solid var(--gold); 
            color: #fff;
            text-shadow: 1px 1px 0 #000;
            text-align: center;
            transform: translate(-50%, -100%);
        }
        .iso-label.focal { border-color: var(--primary); color: var(--primary); }

        .fx-icon { position: absolute; font-size: 1.6rem; transform: translate(-50%,-50%); filter: drop-shadow(0 0 5px var(--primary)); }
        .fx-boom { position: absolute; font-size: 2.6rem; transform: translate(-50%,-50%); transition: opacity 0.5s, transform 0.5s; }
        .fx-text { position: absolute; font-weight: 900; font-size: 1.1rem; transform: translate(-50%,-50%); text-shadow: 1px 1px 0 #000; transition: opacity 1s, top 1s; }

        /* Yürüyüş / iz koordinat rozeti */
        #coord-badge {
            position: absolute; bottom: 96px; left: 50%; transform: translateX(-50%);
            background: rgba(10,10,8,0.85); border: 1px solid var(--gold); border-radius: 6px;
            padding: 4px 14px; font-size: 0.8rem; color: var(--gold); font-weight: 700;
            letter-spacing: 1px; z-index: 18; pointer-events: none;
        }

        /* Zoom kontrolleri */
        #zoom-controls {
            position: absolute; right: 14px; bottom: 130px; z-index: 21;
            display: flex; flex-direction: column; gap: 8px;
        }
        .zoom-btn {
            width: 40px; height: 40px; border-radius: 8px;
            background: linear-gradient(180deg, rgba(30,30,26,0.95), rgba(15,15,12,0.95));
            border: 1px solid var(--gold); color: var(--gold); font-size: 1.3rem; font-weight: 900;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.6);
        }
        .zoom-btn:active { transform: scale(0.92); }

        /* Dairesel/baloncuk hızlı aksiyon menüsü */
        #radial-menu { position: fixed; left: 0; top: 0; z-index: 60; display: none; pointer-events: none; }
        #radial-menu.active { display: block; pointer-events: auto; }
        .radial-btn {
            position: absolute; width: 46px; height: 46px; border-radius: 50%;
            background: linear-gradient(180deg, rgba(42,32,18,0.97), rgba(15,12,8,0.97));
            border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center;
            font-size: 1.25rem; box-shadow: 0 4px 14px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.08);
            cursor: pointer; transform: translate(-50%, -50%) scale(0);
            transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        #radial-menu.active .radial-btn { transform: translate(-50%, -50%) scale(1); }
        .radial-btn:active { transform: translate(-50%, -50%) scale(0.88); }
        .radial-btn-label {
            position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
            font-size: 0.6rem; color: var(--gold); white-space: nowrap; font-weight: 700;
            text-shadow: 1px 1px 0 #000;
        }

        /* Üst Bar */
        .top-bar { 
            position: absolute; top: 0; left: 0; right: 0; z-index: 20; 
            background: linear-gradient(180deg, rgba(0,0,0,0.95), transparent); 
            padding: 10px 15px; display: flex; justify-content: space-between; align-items: flex-start; 
            pointer-events: none; 
        }
        .player-info { display: flex; gap: 8px; align-items: center; pointer-events: auto; flex-wrap: wrap; }
        .stat-badge { 
            background: linear-gradient(180deg, rgba(40,32,20,0.95), rgba(18,14,8,0.95)); 
            padding: 5px 11px; border-radius: 8px; 
            border: 1px solid var(--gold); font-size: 0.85rem; display: flex; align-items: center; gap: 5px; 
            box-shadow: 0 3px 8px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
        }
        .stat-badge span { color: var(--gold); font-weight: 700; font-size: 0.95rem; }
        .avatar { 
            width: 48px; height: 48px; border-radius: 8px; border: 2px solid var(--gold); 
            display: flex; justify-content: center; align-items: center; font-size: 1.8rem; 
            background: linear-gradient(180deg,#2a2a30,#141418); box-shadow: 0 0 10px rgba(255,107,0,0.5), inset 0 0 8px rgba(0,0,0,0.6);
        }

        /* Alt Bar */
        .bottom-bar { 
            position: absolute; bottom: 0; left: 0; right: 0; height: 90px; 
            background: linear-gradient(0deg, rgba(0,0,0,0.95), transparent); 
            display: flex; justify-content: center; align-items: flex-end; padding-bottom: 15px; z-index: 20; 
            pointer-events: none; 
        }
        .toolbar { 
            display: flex; gap: 12px; pointer-events: auto; 
            background: linear-gradient(180deg, rgba(46,34,20,0.97), rgba(20,14,8,0.97)); 
            padding: 10px 18px; border-radius: 14px; border-top: 2px solid var(--gold); 
            border-left: 1px solid var(--gold); border-right: 1px solid var(--gold); border-bottom: 1px solid var(--gold);
            box-shadow: 0 -5px 20px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.06); 
        }
        .tool-btn { 
            display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 5px; 
            border-radius: 8px; transition: 0.2s; width: 58px; 
        }
        .tool-btn:hover { background: rgba(255,107,0,0.2); transform: translateY(-3px); }
        .tool-icon { 
            font-size: 1.9rem; margin-bottom: 2px; 
            filter: drop-shadow(0 0 3px var(--primary));
        }
        .tool-text { font-size: 0.7rem; color: #d8c9a8; text-transform: uppercase; font-weight: 600; }

        /* Modallar ve Popup'lar */
        .modal-overlay { 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(0,0,0,0.8); z-index: 50; display: none; 
            justify-content: center; align-items: center; backdrop-filter: blur(5px); animation: fadeIn 0.2s; 
        }
        .modal-box { 
            background: var(--panel); border: 2px solid var(--gold); border-radius: 12px; 
            padding: 30px; width: 450px; max-width: 90vw; max-height: 80vh; overflow-y: auto; 
            box-shadow: 0 0 50px rgba(255,107,0,0.3); animation: scaleIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .modal-box h2 { font-family: 'Cinzel'; color: var(--gold); margin-bottom: 20px; text-align: center; text-shadow: 0 0 10px var(--primary); }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; font-size: 1rem; }
        .info-row span:first-child { color: #aaa; }
        .input-group { margin: 10px 0; }
        .input-group label { display: block; margin-bottom: 5px; color: #ccc; font-size: 0.9rem; }
        .input-group input { width: 100%; padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid #333; color: white; border-radius: 6px; font-family: 'Rajdhani'; font-size: 1rem; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        #toast-container { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); z-index: 100; }
        .toast { 
            padding: 12px 25px; border-radius: 8px; margin-top: 8px; font-weight: 700; 
            animation: scaleIn 0.4s; text-align: center; min-width: 250px; 
            border: 1px solid var(--gold);
        }
        .toast.success { background: rgba(0,204,68,0.9); }
        .toast.victory { background: rgba(255,215,0,0.9); color: #000; }
        .toast.defeat { background: rgba(255,51,51,0.9); }
        .toast.info { background: rgba(0,212,255,0.9); color: #000; }
        .toast.error { background: rgba(255,51,51,0.9); }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-box">
        <div class="game-title">ATLAS WARFARE</div>
        <div class="game-subtitle">Dünyayı Fethet, İmparatorluğunu Kur</div>

        <div id="login-form">
            <input type="text" id="login-username" class="auth-input" placeholder="Kahraman Adı veya E-posta" onkeydown="if(event.key==='Enter')login()">
            <input type="password" id="login-password" class="auth-input" placeholder="Şifre" onkeydown="if(event.key==='Enter')login()">
            <button class="btn btn-primary" onclick="login()">Giriş Yap</button>
            <button class="btn btn-secondary" onclick="toggleAuth('register')">Hesap Oluştur</button>
            <button class="btn btn-secondary" onclick="toggleAuth('forgot')" style="margin-top:5px;font-size:0.85rem;padding:8px;">Şifremi Unuttum</button>
            <div id="login-error" class="error-msg"></div>
        </div>

        <div id="register-form" style="display:none;">
            <input type="text" id="reg-username" class="auth-input" placeholder="Kahraman Adı">
            <input type="email" id="reg-email" class="auth-input" placeholder="E-posta">
            <input type="password" id="reg-password" class="auth-input" placeholder="Şifre (min 6)">
            <input type="password" id="reg-password-confirm" class="auth-input" placeholder="Şifre Tekrar">
            <button class="btn btn-primary" onclick="register()">Kayıt Ol</button>
            <button class="btn btn-secondary" onclick="toggleAuth('login')">Geri Dön</button>
            <div id="reg-error" class="error-msg"></div>
        </div>

        <div id="verify-form" style="display:none;">
            <h3 style="color:var(--secondary);margin-bottom:10px;">E-posta Doğrulama</h3>
            <input type="text" id="verify-code" class="auth-input" placeholder="000000" maxlength="6" style="text-align:center;font-size:1.5rem;letter-spacing:10px;">
            <button class="btn btn-primary" onclick="verifyEmail()">Doğrula ve Oyna</button>
            <button class="btn btn-secondary" onclick="resendCode()" style="margin-top:5px;font-size:0.85rem;padding:8px;">Kodu Tekrar Gönder</button>
            <div id="verify-error" class="error-msg"></div>
        </div>

        <div id="forgot-form" style="display:none;">
            <input type="email" id="forgot-email" class="auth-input" placeholder="E-posta">
            <button class="btn btn-primary" onclick="forgotPassword()">Kod Gönder</button>
            <div id="forgot-code-area" style="display:none;margin-top:10px;">
                <input type="text" id="forgot-code" class="auth-input" placeholder="Kod">
                <input type="password" id="forgot-newpass" class="auth-input" placeholder="Yeni Şifre">
                <button class="btn btn-primary" onclick="resetPassword()">Sıfırla</button>
            </div>
            <button class="btn btn-secondary" onclick="toggleAuth('login')">Geri Dön</button>
            <div id="forgot-error" class="error-msg"></div>
        </div>
    </div>
</div>

<div id="char-select-screen">
    <div style="text-align:center;width:100%;">
        <h1 style="font-family:'Cinzel';color:var(--primary);font-size:2rem;margin-bottom:20px;">Kahramanını Seç</h1>
        <div class="char-grid" id="char-grid"></div>
        <div id="empire-color-section" style="display:none;margin-top:25px;">
            <h3 style="color:var(--secondary);">İmparatorluk Rengini Seç</h3>
            <div class="color-grid" id="color-grid"></div>
            <button class="btn btn-primary" style="max-width:300px;margin:15px auto 0;" onclick="startGame()">Savaşa Başla</button>
        </div>
    </div>
</div>

<div id="game-screen">
    <div id="map-container">
        <canvas id="map-canvas"></canvas>
        <div id="css2d-layer"></div>
    </div>
    <div id="golden-hour-overlay"></div>
    <div id="coord-badge">X: <span id="coord-x">0</span>  Y: <span id="coord-y">0</span></div>
    <div id="zoom-controls">
        <div class="zoom-btn" onclick="camera.zoomBy(1.25)">+</div>
        <div class="zoom-btn" onclick="camera.zoomBy(0.8)">−</div>
        <div class="zoom-btn" onclick="camera.centerOnBase()" title="Üsse dön">⌖</div>
    </div>

    <div class="top-bar">
        <div class="player-info">
            <div class="avatar" id="ui-avatar">🦊</div>
            <div class="stat-badge">⚡ <span id="ui-power">0</span></div>
            <div class="stat-badge" style="border-color:var(--secondary);">🐉 <span id="ui-clan">-</span></div>
        </div>
        <div class="player-info">
            <div class="stat-badge" style="border-color:var(--gold);">🪙 <span id="ui-ryo">0</span></div>
            <div class="stat-badge">🛡️ <span id="ui-infantry">0</span></div>
            <div class="stat-badge">🏹 <span id="ui-archer">0</span></div>
            <div class="stat-badge">🐎 <span id="ui-cavalry">0</span></div>
        </div>
    </div>

    <div class="bottom-bar">
        <div class="toolbar">
            <div class="tool-btn" onclick="openModal('profile')"><div class="tool-icon">👤</div><div class="tool-text">Profil</div></div>
            <div class="tool-btn" onclick="openModal('train')"><div class="tool-icon">🔨</div><div class="tool-text">Eğit</div></div>
            <div class="tool-btn" onclick="openModal('hospital')"><div class="tool-icon">🏥</div><div class="tool-text">Hastane</div></div>
            <div class="tool-btn" onclick="openModal('clan')"><div class="tool-icon">🐉</div><div class="tool-text">Klan</div></div>
            <div class="tool-btn" onclick="openModal('leaderboard')"><div class="tool-icon">🏆</div><div class="tool-text">Sıralama</div></div>
            <div class="tool-btn" onclick="socket.emit('getInbox')"><div class="tool-icon">✉️</div><div class="tool-text">Mesaj</div></div>
            <div class="tool-btn" onclick="openBaseModal()"><div class="tool-icon">🏰</div><div class="tool-text">Üs</div></div>
        </div>
    </div>

    <div class="modal-overlay" id="modal-overlay"><div class="modal-box" id="modal-box"></div></div>
    <div id="toast-container"></div>
    <div id="radial-menu"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let currentPlayer = null, worldData = null, charactersData = null, clansData = {};
let selectedCharacter = null, selectedColor = null, selectedCityId = null, selectedMineId = null, selectedBossId = null;
let basePlacementMode = false;
const icons = { kyuubi:'🦊', alchemist:'⚒️', mistsword:'🌫️', raikage:'⚡', soulreaper:'⚔️', titan:'🗡️', rubber:'👊', icequeen:'❄️' };

let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playSound(type) {
    if (!audioCtx) return; const now = audioCtx.currentTime;
    if (type === 'click') { const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.setValueAtTime(800,now); o.frequency.exponentialRampToValueAtTime(400,now+0.05); g.gain.setValueAtTime(0.1,now); g.gain.exponentialRampToValueAtTime(0.01,now+0.05); o.start(now); o.stop(now+0.05); }
    else if (type === 'success') { [523.25,659.25,783.99].forEach((f,i)=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.setValueAtTime(f,now+i*0.1);g.gain.setValueAtTime(0.1,now+i*0.1);g.gain.exponentialRampToValueAtTime(0.01,now+i*0.1+0.2);o.start(now+i*0.1);o.stop(now+i*0.1+0.2);}); }
    else if (type === 'error') { const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.type='sawtooth'; o.frequency.setValueAtTime(150,now); g.gain.setValueAtTime(0.1,now); g.gain.exponentialRampToValueAtTime(0.01,now+0.2); o.start(now); o.stop(now+0.2); }
    else if (type === 'explosion') { const bs=audioCtx.sampleRate*0.3,b=audioCtx.createBuffer(1,bs,audioCtx.sampleRate),d=b.getChannelData(0); for(let i=0;i<bs;i++)d[i]=Math.random()*2-1; const n=audioCtx.createBufferSource(); n.buffer=b; const nf=audioCtx.createBiquadFilter(); nf.type='lowpass'; nf.frequency.setValueAtTime(1000,now); nf.frequency.exponentialRampToValueAtTime(100,now+0.3); const ng=audioCtx.createGain(); ng.gain.setValueAtTime(0.3,now); ng.gain.exponentialRampToValueAtTime(0.01,now+0.3); n.connect(nf); nf.connect(ng); ng.connect(audioCtx.destination); n.start(now); n.stop(now+0.3); }
}
document.addEventListener('click', () => initAudio(), { once: true });
document.body.addEventListener('click', (e) => { if (e.target.closest('.tool-btn') || e.target.tagName === 'BUTTON') playSound('click'); });

// AUTH
function toggleAuth(t) { ['login-form','register-form','verify-form','forgot-form'].forEach(id => document.getElementById(id).style.display = 'none'); document.getElementById(t === 'login' ? 'login-form' : t === 'register' ? 'register-form' : t === 'forgot' ? 'forgot-form' : 'verify-form').style.display = 'block'; ['login-error','reg-error','verify-error','forgot-error'].forEach(id => document.getElementById(id).style.display = 'none'); }
function login() { socket.emit('login', { username: document.getElementById('login-username').value, password: document.getElementById('login-password').value }); }
function register() { socket.emit('register', { username: document.getElementById('reg-username').value, email: document.getElementById('reg-email').value, password: document.getElementById('reg-password').value, passwordConfirm: document.getElementById('reg-password-confirm').value }); }
function verifyEmail() { socket.emit('verifyEmail', { username: currentRegUsername, code: document.getElementById('verify-code').value }); }
function resendCode() { socket.emit('resendVerifyCode', { username: currentRegUsername }); }
function forgotPassword() { socket.emit('forgotPassword', { email: document.getElementById('forgot-email').value }); }
function resetPassword() { socket.emit('resetPassword', { email: document.getElementById('forgot-email').value, code: document.getElementById('forgot-code').value, newPassword: document.getElementById('forgot-newpass').value }); }

let currentRegUsername = '';
socket.on('loginError', (msg) => { const ids = ['login-error','reg-error','verify-error','forgot-error']; ids.forEach(id => { const el = document.getElementById(id); if(el) { el.innerText = msg; el.style.display = msg ? 'block' : 'none'; } }); });
socket.on('registerSuccess', (d) => { currentRegUsername = d.username; toggleAuth('verify'); });
socket.on('forgotPasswordCodeSent', () => { document.getElementById('forgot-code-area').style.display = 'block'; });
socket.on('resetPasswordSuccess', () => { toggleAuth('login'); });
socket.on('verifySuccess', (d) => onLoginSuccess(d));
socket.on('loginSuccess', (d) => onLoginSuccess(d));

function onLoginSuccess(d) { localStorage.setItem('atlas_token', d.token); currentPlayer = d; document.getElementById('auth-screen').style.display = 'none'; if (!d.character || !d.empireColor) showCharSelect(); else enterGame(d); }

function showCharSelect() { document.getElementById('char-select-screen').style.display = 'flex'; renderCharGrid(); }
function renderCharGrid() {
    if (!charactersData) return;
    const grid = document.getElementById('char-grid'); grid.innerHTML = '';
    const elemColors = { fire:'#ff4400', water:'#00aaff', lightning:'#ffff00', wind:'#00ff88', earth:'#8B4513' };
    charactersData.forEach(c => {
        const card = document.createElement('div'); card.className = 'char-card';
        card.onclick = () => { document.querySelectorAll('.char-card').forEach(x => x.classList.remove('selected')); card.classList.add('selected'); selectedCharacter = c.id; socket.emit('selectCharacter', { characterId: c.id }); document.getElementById('empire-color-section').style.display = 'block'; renderColorGrid(); };
        card.innerHTML = `<div class="char-icon">${icons[c.id]||'⚔️'}</div><div class="char-name">${c.name}</div><div class="char-element" style="color:${elemColors[c.element]}">${c.element.toUpperCase()}</div><div class="char-ability">${c.ability}</div>`;
        grid.appendChild(card);
    });
}
socket.on('charactersData', (d) => { charactersData = d; if (document.getElementById('char-select-screen').style.display === 'flex') renderCharGrid(); });

function renderColorGrid() {
    const colors = [0xff6b00, 0x00d4ff, 0xff0066, 0x00ff44, 0xffd700, 0x9d00ff, 0xff3333, 0xffffff]; const grid = document.getElementById('color-grid'); grid.innerHTML = '';
    colors.forEach(c => { const sw = document.createElement('div'); sw.className = 'color-swatch'; sw.style.background = '#' + c.toString(16).padStart(6,'0'); sw.onclick = () => { document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('selected')); sw.classList.add('selected'); selectedColor = c; }; grid.appendChild(sw); });
}
function startGame() { 
    if (!selectedCharacter || !selectedColor) return showToast('error', 'Karakter ve renk seçmelisin!'); 
    socket.emit('setEmpireColor', { color: selectedColor }); 
    currentPlayer.character = selectedCharacter; currentPlayer.empireColor = selectedColor; 
    document.getElementById('char-select-screen').style.display = 'none'; enterGame(currentPlayer); 
}

function enterGame(d) {
    document.getElementById('game-screen').style.display = 'block';
    document.getElementById('ui-ryo').innerText = d.ryo;
    document.getElementById('ui-infantry').innerText = d.army?.infantry || 0;
    document.getElementById('ui-archer').innerText = d.army?.archer || 0;
    document.getElementById('ui-cavalry').innerText = d.army?.cavalry || 0;
    document.getElementById('ui-avatar').innerText = icons[d.character] || '🦊';
    if (d.clan && clansData[d.clan]) { document.getElementById('ui-clan').innerText = clansData[d.clan].name; }
    renderMap();
    requestAnimationFrame(() => camera.centerOnBase());
}

function hashStr(str) { let h = 0; for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0; return h; }
function rand01(seed) { const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453123; return x - Math.floor(x); }

function latLngToWorld(lat, lng) { return { wx: (lng / 180) * 1000, wz: (-lat / 90) * 500 }; }
function xzToWorld(x, z) { return { wx: x, wz: z }; }

function makeAsphaltTexture() {
    const c = document.createElement('canvas'); c.width = 512; c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#4a4740'; ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 700; i++) {
        const x = Math.random() * 512, y = Math.random() * 512, r = 3 + Math.random() * 18;
        const dark = Math.random() < 0.5;
        ctx.fillStyle = dark ? `rgba(15,14,12,${0.05 + Math.random() * 0.10})` : `rgba(90,86,74,${0.04 + Math.random() * 0.08})`;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(12,11,9,0.55)'; ctx.lineWidth = 1.1;
    for (let i = 0; i < 22; i++) {
        let x = Math.random() * 512, y = Math.random() * 512;
        ctx.beginPath(); ctx.moveTo(x, y);
        for (let j = 0; j < 5; j++) { x += (Math.random() - 0.5) * 46; y += (Math.random() - 0.5) * 46; ctx.lineTo(x, y); }
        ctx.stroke();
    }
    for (let i = 0; i < 4; i++) { ctx.fillStyle = 'rgba(58,54,46,0.45)'; ctx.fillRect(Math.random() * 440, Math.random() * 440, 36 + Math.random() * 50, 26 + Math.random() * 36); }
    ctx.strokeStyle = 'rgba(255,210,90,0.5)'; ctx.lineWidth = 4; ctx.setLineDash([20, 16]);
    ctx.beginPath(); ctx.moveTo(0, 256); ctx.lineTo(512, 256); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = 'rgba(225,220,205,0.28)'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(0, 30); ctx.lineTo(512, 30); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 482); ctx.lineTo(512, 482); ctx.stroke();
    ctx.strokeStyle = 'rgba(18,16,13,0.7)'; ctx.lineWidth = 2;
    [[120, 140], [380, 350]].forEach(([mx, my]) => {
        ctx.beginPath(); ctx.arc(mx, my, 15, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(mx, my, 9, 0, Math.PI * 2); ctx.stroke();
    });
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.anisotropy = 8; tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
}
function makeCurbTexture() {
    const c = document.createElement('canvas'); c.width = 64; c.height = 64;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#6e6a5f'; ctx.fillRect(0, 0, 64, 64);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    for (let i = 0; i < 6; i++) ctx.fillRect(Math.random() * 60, Math.random() * 60, 3, 3);
    const tex = new THREE.CanvasTexture(c); tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
}
function makeWallTexture(baseHex, darkHex, warm, cottage) {
    const c = document.createElement('canvas'); c.width = 128; c.height = 128;
    const ctx = c.getContext('2d');
    ctx.fillStyle = baseHex; ctx.fillRect(0, 0, 128, 128);
    ctx.globalAlpha = 0.14; ctx.fillStyle = darkHex;
    for (let y = 0; y < 128; y += 10) ctx.fillRect(0, y, 128, 1);
    ctx.globalAlpha = 1;
    const winW = cottage ? 10 : 12, winH = cottage ? 14 : 16, gapX = cottage ? 26 : 22, gapY = cottage ? 34 : 26;
    for (let y = 12; y < 118; y += gapY) {
        for (let x = 8; x < 120; x += gapX) {
            const lit = Math.random() < 0.42;
            ctx.fillStyle = lit ? '#ffcf7a' : (warm ? '#332920' : '#1b2229');
            ctx.fillRect(x, y, winW, winH);
            ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 1; ctx.strokeRect(x, y, winW, winH);
            if (lit) { ctx.fillStyle = 'rgba(255,207,122,0.25)'; ctx.fillRect(x - 2, y - 2, winW + 4, winH + 4); }
        }
    }
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.colorSpace = THREE.SRGBColorSpace;
    return tex;
}
function makeRoofTexture(hex, darkHex) {
    const c = document.createElement('canvas'); c.width = 64; c.height = 64;
    const ctx = c.getContext('2d');
    ctx.fillStyle = hex; ctx.fillRect(0, 0, 64, 64);
    ctx.strokeStyle = darkHex; ctx.lineWidth = 1; ctx.globalAlpha = 0.5;
    for (let y = 0; y < 64; y += 7) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(64, y); ctx.stroke(); }
    ctx.globalAlpha = 1;
    const tex = new THREE.CanvasTexture(c);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    return tex;
}

function box(mat, sx, sy, sz, x, y, z) {
    const m = new THREE.Mesh(GEO.box, mat); m.scale.set(sx, sy, sz); m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true; return m;
}
function cyl(mat, r, h, x, y, z) {
    const m = new THREE.Mesh(GEO.cylinder, mat); m.scale.set(r, h, r); m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true; return m;
}
function cone(mat, r, h, x, y, z) {
    const m = new THREE.Mesh(GEO.cone, mat); m.scale.set(r, h, r); m.position.set(x, y, z);
    m.castShadow = true; return m;
}
function contactShadow(radius, y = 0.03) {
    const m = new THREE.Mesh(GEO.circle, MAT.shadowBlob);
    m.rotation.x = -Math.PI / 2; m.scale.set(radius, radius, 1); m.position.y = y;
    return m;
}

// ---------- Bina aileleri: her biri gerçek hacimli, farklı silüetli 3D obje üretir ----------
function familyForSeed(seed) {
    const r = seed % 100;
    if (r < 20) return 'tower';
    if (r < 40) return 'warehouse';
    if (r < 60) return 'industrial';
    if (r < 80) return 'residential';
    return 'shop';
}

function createBuildingGroup(opts) {
    // opts: { label, family, danger, capitalScale, seed }
    const seed = opts.seed ?? hashStr(opts.label || 'bina');
    const family = opts.family || familyForSeed(seed);
    const cool = !opts.danger && (seed % 3 === 0);
    const wallMat = opts.danger ? MAT.wallDanger : (opts.capital ? MAT.wallCapital : (cool ? MAT.wallCool : MAT.wallWarm));
    const roofMat = opts.danger ? MAT.roofDanger : (cool ? MAT.roofCool : MAT.roofWarm);
    const g = new THREE.Group();
    const jitter = rand01(seed);

    let footprint = 12, height = 16;
    if (family === 'tower') { footprint = 10; height = 28 + jitter * 14; }
    else if (family === 'warehouse') { footprint = 18; height = 9 + jitter * 3; }
    else if (family === 'industrial') { footprint = 14; height = 12 + jitter * 6; }
    else if (family === 'residential') { footprint = 13; height = 13 + jitter * 8; }
    else if (family === 'shop') { footprint = 9; height = 6 + jitter * 2; }

    const fx = footprint * (0.85 + jitter * 0.3);
    const fz = footprint * (0.85 + rand01(seed + 7) * 0.3);

    // ana gövde
    const body = box(wallMat, fx, height, fz, 0, height / 2, 0);
    g.add(body);
    // hafif üst kademe (silüet çeşitliliği)
    if (family === 'tower' || family === 'residential') {
        const stepH = height * 0.28;
        g.add(box(wallMat, fx * 0.62, stepH, fz * 0.62, 0, height + stepH / 2, 0));
    }
    if (family === 'residential') {
        // balkon çıkıntıları
        for (let i = 0; i < 3; i++) {
            const by = height * (0.3 + i * 0.22);
            g.add(box(MAT.stoneWallDark, fx * 0.9, 0.6, 1.6, 0, by, fz / 2 + 0.9));
        }
    }
    if (family === 'industrial') {
        // baca + boru detayları
        g.add(cyl(MAT.metalDark, 0.9, height * 0.55, fx * 0.28, height + height * 0.28, -fz * 0.2));
        g.add(cyl(MAT.metalDark, 1.3, height * 0.9, -fx * 0.3, height * 0.9 / 2 + 0.2, fz * 0.25));
    }
    if (family === 'warehouse') {
        // yükleme rampası kapı şeridi
        g.add(box(MAT.metalDark, fx * 0.5, height * 0.55, 0.3, 0, height * 0.3, fz / 2 + 0.15));
    }
    if (family === 'shop') {
        // tente / tabela
        g.add(box(opts.danger ? MAT.wallDanger : MAT.roofWarm, fx * 1.05, 0.5, 1.6, 0, height * 0.72, fz / 2 + 0.9));
    }

    // çatı
    const roofH = height * 0.16;
    g.add(box(roofMat, fx * 1.06, roofH, fz * 1.06, 0, height + roofH / 2, 0));
    if (family === 'tower') {
        g.add(cone(roofMat, fx * 0.5, height * 0.22, 0, height + roofH + (height * 0.22) / 2, 0));
        g.add(cyl(MAT.metalDark, 0.15, height * 0.18, 0, height + roofH + height * 0.22 + (height * 0.18) / 2, 0));
    }

    // hasar/tehlike detayları (boss inleri için)
    if (opts.danger) {
        const spike = cone(MAT.metalDark, 0.5, 3.2, fx * 0.3, height + roofH + 1.6, fz * 0.2);
        g.add(spike);
    }

    g.add(contactShadow(Math.max(fx, fz) * 0.62));

    if (opts.capital) {
        g.scale.setScalar(1.35);
    }

    g.userData.topY = (opts.capital ? 1.35 : 1) * (height + roofH + (family === 'tower' ? height * 0.22 + height * 0.18 : 0)) + 2.2;
    g.userData.footprint = Math.max(fx, fz) * (opts.capital ? 1.35 : 1);
    return g;
}

function createHouseGroup(opts) {
    const g = new THREE.Group();
    const seed = hashStr(opts.label || 'ev');
    const fx = 12, fz = 12, height = 7 + rand01(seed) * 2;
    g.add(box(MAT.grass, fx * 1.6, 0.15, fz * 1.6, 0, 0.08, 0));
    g.add(box(MAT.houseWall, fx, height, fz, 0, height / 2, 0));
    const roofH = height * 0.55;
    const roofMesh = new THREE.Mesh(GEO.cone, MAT.houseRoof);
    roofMesh.scale.set(fx * 0.78, roofH, fz * 0.78);
    roofMesh.position.set(0, height + roofH / 2, 0);
    roofMesh.rotation.y = Math.PI / 4;
    roofMesh.castShadow = true;
    // dört kenarlı çatı hissi için koniyi kareye yakın low-poly bırakıyoruz (cone segment=10 zaten çokgen)
    g.add(roofMesh);
    g.add(box(MAT.metalDark, 2.2, height * 0.6, 0.3, 0, height * 0.32, fz / 2 + 0.05));
    if (opts.highlight) {
        const ring = new THREE.Mesh(GEO.circle, new THREE.MeshBasicMaterial({ color: 0xff6b00, transparent: true, opacity: 0.35 }));
        ring.rotation.x = -Math.PI / 2; ring.scale.set(fx * 1.5, fz * 1.5, 1); ring.position.y = 0.04;
        g.add(ring);
        const pole = cyl(MAT.metalDark, 0.15, height * 1.1, fx / 2, height * 0.55 + height * 1.1 / 2, -fz / 2);
        g.add(pole);
        const flagColor = (currentPlayer && currentPlayer.empireColor) ? currentPlayer.empireColor : 0xff6b00;
        const flag = box(new THREE.MeshStandardMaterial({ color: flagColor, roughness: 0.6 }), 3, 1.8, 0.1, fx / 2 + 1.5, height * 0.55 + height * 1.1 - 0.9, -fz / 2);
        g.add(flag);
    }
    g.add(contactShadow(fx * 0.95));
    g.userData.topY = height + roofH + 2.4;
    g.userData.footprint = fx * 1.6;
    return g;
}

// ---------- Ana üs / başkent: sahnenin en büyük ve en detaylı yapısı ----------
function createCapitalGroup(opts) {
    const g = new THREE.Group();
    const R = 30; // sur yarıçapı

    // avlu zemini
    const yard = new THREE.Mesh(GEO.circle, MAT.courtyard);
    yard.rotation.x = -Math.PI / 2; yard.scale.set(R * 0.96, R * 0.96, 1); yard.position.y = 0.05;
    yard.receiveShadow = true;
    g.add(yard);

    // dış sur (4 kenar, bir kenarda kapı boşluğu)
    const wallH = 9, wallT = 2.2;
    const sides = [
        { x: 0, z: -R, w: R * 2, gate: true },
        { x: 0, z: R, w: R * 2, gate: false },
        { x: -R, z: 0, w: R * 2, rot: true },
        { x: R, z: 0, w: R * 2, rot: true },
    ];
    sides.forEach(s => {
        if (s.gate) {
            const half = (s.w - 9) / 2;
            g.add(box(MAT.stoneWall, half, wallH, wallT, -s.w / 4 - 2.25, wallH / 2, s.z));
            g.add(box(MAT.stoneWall, half, wallH, wallT, s.w / 4 + 2.25, wallH / 2, s.z));
            // kapı kemeri
            g.add(box(MAT.stoneWallDark, 9, 2, wallT * 1.3, 0, wallH - 1, s.z));
            g.add(cyl(MAT.gold, 0.35, wallH * 0.85, -4.5, wallH * 0.42, s.z));
            g.add(cyl(MAT.gold, 0.35, wallH * 0.85, 4.5, wallH * 0.42, s.z));
        } else if (s.rot) {
            const m = box(MAT.stoneWall, wallT, wallH, s.w, s.x, wallH / 2, 0);
            g.add(m);
        } else {
            g.add(box(MAT.stoneWall, s.w, wallH, wallT, s.x, wallH / 2, s.z));
        }
    });
    // sur mazgalları (crenellation)
    for (let i = -R; i <= R; i += 4) {
        g.add(box(MAT.stoneWallDark, 1.6, 1.4, 1.6, i, wallH + 0.7, -R));
        g.add(box(MAT.stoneWallDark, 1.6, 1.4, 1.6, i, wallH + 0.7, R));
        g.add(box(MAT.stoneWallDark, 1.6, 1.4, 1.6, -R, wallH + 0.7, i));
        g.add(box(MAT.stoneWallDark, 1.6, 1.4, 1.6, R, wallH + 0.7, i));
    }
    // köşe kuleleri
    [[-R, -R], [R, -R], [-R, R], [R, R]].forEach(([tx, tz]) => {
        const th = wallH * 2.1;
        g.add(cyl(MAT.stoneWall, 3.6, th, tx, th / 2, tz));
        g.add(cone(MAT.roofDanger, 4.2, 5.5, tx, th + 2.75, tz));
        g.add(cyl(MAT.gold, 0.18, 2.5, tx, th + 6.3, tz));
    });

    // merkez kale (ana bina, çok katmanlı)
    const keepMats = [MAT.wallCapital, MAT.wallCapital, MAT.wallCapital];
    g.add(box(MAT.wallCapital, 15, 11, 15, 0, 5.5, 0));
    g.add(box(MAT.wallCapital, 10, 8, 10, 0, 11 + 4, 0));
    g.add(box(MAT.roofWarm, 16, 1.4, 16, 0, 11.7, 0));
    const spire = cone(MAT.roofWarm, 7.4, 8, 0, 11 + 8 + 4, 0);
    g.add(spire);
    g.add(cyl(MAT.gold, 0.25, 3, 0, 11 + 8 + 8 + 1.5, 0));
    // kale bayrağı
    const flagColor = (currentPlayer && currentPlayer.empireColor) ? currentPlayer.empireColor : 0xffd700;
    g.add(box(new THREE.MeshStandardMaterial({ color: flagColor, roughness: 0.6 }), 3.4, 2, 0.12, 1.9, 11 + 8 + 8 + 2.4, 0));

    // kale çevresine ışık kuleleri (spot light kaideleri)
    [[-9, -9], [9, -9], [-9, 9], [9, 9]].forEach(([lx, lz]) => {
        g.add(cyl(MAT.metalDark, 0.4, 5.5, lx, 2.75, lz));
        const lamp = new THREE.Mesh(GEO.sphere, MAT.lampGlow);
        lamp.scale.setScalar(0.55); lamp.position.set(lx, 5.6, lz);
        g.add(lamp);
        const pl = new THREE.PointLight(0xffb347, 6, 30, 2);
        pl.position.set(lx, 6, lz);
        g.add(pl);
    });

    // helikopter pisti
    const pad = new THREE.Mesh(GEO.circle, MAT.helipad);
    pad.rotation.x = -Math.PI / 2; pad.scale.set(6.5, 6.5, 1); pad.position.set(20, 0.08, -16);
    g.add(pad);
    const padRing = new THREE.Mesh(GEO.circle, new THREE.MeshBasicMaterial({ color: 0xffd700 }));
    padRing.rotation.x = -Math.PI / 2; padRing.scale.set(6.6, 6.6, 1); padRing.position.set(20, 0.06, -16);
    g.add(padRing);
    const padH1 = box(MAT.gold, 3.2, 0.15, 0.9, 20, 0.14, -16);
    const padH2 = box(MAT.gold, 0.9, 0.15, 3.2, 20, 0.14, -16);
    g.add(padH1, padH2);

    // araç girişi (kapıdan avluya yol şeridi)
    g.add(box(new THREE.MeshStandardMaterial({ color: 0x2c2a26, roughness: 0.9 }), 8, 0.06, 14, 0, 0.03, -R + 7));

    g.add(contactShadow(R * 1.05, 0.02));

    g.userData.topY = 11 + 8 + 8 + 4;
    g.userData.footprint = R * 1.5;
    return g;
}

// ---------- Kentsel dolgu objeleri (arabalar, konteynerler, sokak lambaları vb.) ----------
function createProp(kind, seed) {
    const g = new THREE.Group();
    const r = rand01(seed);
    if (kind === 'car') {
        const mat = MAT.carBody[Math.floor(r * MAT.carBody.length)];
        g.add(box(mat, 4.2, 1.3, 1.9, 0, 0.75, 0));
        g.add(box(MAT.carGlass, 2.2, 0.8, 1.7, -0.2, 1.65, 0));
        [[-1.4, -0.9], [1.4, -0.9], [-1.4, 0.9], [1.4, 0.9]].forEach(([wx, wz]) => g.add(cyl(MAT.metalDark, 0.42, 0.3, wx, 0.42, wz)));
    } else if (kind === 'truck') {
        g.add(box(MAT.carBody[2], 3, 1.6, 2.1, -1.6, 0.9, 0));
        g.add(box(MAT.container[Math.floor(r * MAT.container.length)], 5.6, 2.4, 2.2, 1.6, 1.3, 0));
        [[-2.6, -1], [-0.6, -1], [2.6, -1], [0.6, -1], [-2.6, 1], [-0.6, 1], [2.6, 1], [0.6, 1]].forEach(([wx, wz]) => g.add(cyl(MAT.metalDark, 0.45, 0.32, wx, 0.45, wz)));
    } else if (kind === 'container') {
        g.add(box(MAT.container[Math.floor(r * MAT.container.length)], 6, 2.6, 2.4, 0, 1.3, 0));
        g.add(box(MAT.metalDark, 6.05, 0.15, 2.45, 0, 2.62, 0));
    } else if (kind === 'trash') {
        g.add(cyl(MAT.trash, 0.7, 1.5, 0, 0.75, 0));
        g.add(cyl(MAT.metalDark, 0.72, 0.12, 0, 1.5, 0));
    } else if (kind === 'lamp') {
        g.add(cyl(MAT.lampPole, 0.22, 6.5, 0, 3.25, 0));
        g.add(box(MAT.lampPole, 2.2, 0.22, 0.22, 1, 6.4, 0));
        const bulb = new THREE.Mesh(GEO.sphere, MAT.lampGlow); bulb.scale.setScalar(0.42); bulb.position.set(2, 6.3, 0); g.add(bulb);
        if (r < 0.35) { const pl = new THREE.PointLight(0xffb347, 4, 22, 2); pl.position.set(2, 6.2, 0); g.add(pl); }
    } else if (kind === 'pole') {
        g.add(cyl(MAT.lampPole, 0.18, 8, 0, 4, 0));
        g.add(box(MAT.metalDark, 3, 0.12, 0.12, 0, 7.6, 0));
    } else if (kind === 'barrier') {
        for (let i = 0; i < 3; i++) g.add(box(MAT.barrier, 1.4, 0.9, 0.15, i * 1.7 - 1.7, 0.45, 0));
    } else if (kind === 'sign') {
        g.add(cyl(MAT.signPole, 0.12, 3.4, 0, 1.7, 0));
        g.add(box(MAT.signFace, 1.4, 1.4, 0.08, 0, 3.2, 0));
    } else if (kind === 'pallet') {
        for (let i = 0; i < 2; i++) g.add(box(MAT.pallet, 2, 0.35, 2, 0, 0.2 + i * 0.4, 0));
        g.add(box(MAT.container[Math.floor(r * MAT.container.length)], 1.6, 1.2, 1.6, 0, 1.4, 0));
    } else if (kind === 'tree') {
        g.add(cyl(MAT.treeTrunk, 0.28, 2.2, 0, 1.1, 0));
        const leaves = new THREE.Mesh(GEO.sphere, MAT.treeLeaves); leaves.scale.setScalar(1.6 + r); leaves.position.y = 3.4; leaves.castShadow = true; g.add(leaves);
    }
    g.rotation.y = r * Math.PI * 2;
    return g;
}

// ---------- Sahne kurulumu ----------
function initMapEngine() {
    if (mapEngineReady) return;
    mapEngineReady = true;
    buildTextures();
    buildGeometryLibrary();

    const container = document.getElementById('map-container');
    const canvas = document.getElementById('map-canvas');
    const rect = container.getBoundingClientRect();

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x171308);
    scene.fog = new THREE.FogExp2(0x1b1710, 0.0032);

    camera3d = new THREE.PerspectiveCamera(38, rect.width / rect.height, 1, 3000);
    camState.target = new THREE.Vector3(0, 0, 0);
    updateCameraPosition();

    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(rect.width, rect.height);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;

    labelRenderer = new CSS2DRenderer();
    labelRenderer.setSize(rect.width, rect.height);
    document.getElementById('css2d-layer').appendChild(labelRenderer.domElement);

    // ışıklandırma: sıcak yönlü ana ışık + hemisfer dolgu + hafif atmosferik sis
    const hemi = new THREE.HemisphereLight(0xffcf9a, 0x241a10, 0.55);
    scene.add(hemi);
    sunLight = new THREE.DirectionalLight(0xffb066, 1.55);
    sunLight.position.set(-140, 160, 90);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.camera.left = -220; sunLight.shadow.camera.right = 220;
    sunLight.shadow.camera.top = 220; sunLight.shadow.camera.bottom = -220;
    sunLight.shadow.camera.near = 10; sunLight.shadow.camera.far = 600;
    sunLight.shadow.bias = -0.0015;
    scene.add(sunLight);
    scene.add(sunLight.target);
    const fillLight = new THREE.DirectionalLight(0x3a5a7a, 0.28);
    fillLight.position.set(120, 80, -100);
    scene.add(fillLight);

    // zemin (tek büyük düzlem, tekrarlanan asfalt dokusu -- performanslı ve tutarlı)
    const groundGeo = new THREE.PlaneGeometry(4000, 4000, 1, 1);
    groundMesh = new THREE.Mesh(groundGeo, MAT.ground);
    groundMesh.rotation.x = -Math.PI / 2;
    groundMesh.receiveShadow = true;
    TEX.asphalt.repeat.set(4000 / GRID, 4000 / GRID);
    scene.add(groundMesh);

    dynamicGroup = new THREE.Group(); scene.add(dynamicGroup);
    entitiesGroup = new THREE.Group(); scene.add(entitiesGroup);

    raycaster = new THREE.Raycaster();
    mouseNDC = new THREE.Vector2();

    setupCameraControls();
    window.addEventListener('resize', onWindowResize);
    onWindowResize();
    animate();
}

function onWindowResize() {
    if (!renderer) return;
    const rect = document.getElementById('map-container').getBoundingClientRect();
    if (rect.width < 2 || rect.height < 2) return;
    camera3d.aspect = rect.width / rect.height;
    camera3d.updateProjectionMatrix();
    renderer.setSize(rect.width, rect.height);
    labelRenderer.setSize(rect.width, rect.height);
}

function animate() {
    requestAnimationFrame(animate);
    if (!renderer) return;
    renderer.render(scene, camera3d);
    labelRenderer.render(scene, camera3d);
}

// ---------- Kamera: pan / zoom / merkezleme (gerçek perspektif, top-down değil) ----------
function updateCameraPosition() {
    if (!camera3d || !camState.target) return;
    const horiz = Math.cos(ELEV) * camState.distance;
    const y = Math.sin(ELEV) * camState.distance;
    camera3d.position.set(
        camState.target.x + Math.cos(camState.azimuth) * horiz,
        y,
        camState.target.z + Math.sin(camState.azimuth) * horiz
    );
    camera3d.lookAt(camState.target);
    if (sunLight) {
        sunLight.target.position.copy(camState.target);
        sunLight.position.set(camState.target.x - 140, 160, camState.target.z + 90);
    }
    updateCoordBadge();
    scheduleDynamicRefresh();
}

const camera = {
    zoomBy(f) {
        camState.distance = Math.min(camState.maxDist, Math.max(camState.minDist, camState.distance / f));
        updateCameraPosition();
    },
    panBy(dxScreen, dyScreen) {
        const scale = camState.distance / 620;
        const fwd = new THREE.Vector3(Math.cos(camState.azimuth), 0, Math.sin(camState.azimuth));
        const right = new THREE.Vector3(-Math.sin(camState.azimuth), 0, Math.cos(camState.azimuth));
        camState.target.addScaledVector(right, -dxScreen * scale);
        camState.target.addScaledVector(fwd, dyScreen * scale);
        updateCameraPosition();
    },
    centerOn(wx, wz) { if (!camState.target) return; camState.target.set(wx, 0, wz); updateCameraPosition(); },
    centerOnBase() {
        if (currentPlayer && currentPlayer.base) {
            const { wx, wz } = xzToWorld(currentPlayer.base.x, currentPlayer.base.z);
            this.centerOn(wx, wz);
        } else { this.centerOn(0, 0); }
    },
    get moved() { return camState.moved; }
};

function updateCoordBadge() {
    const xEl = document.getElementById('coord-x'), yEl = document.getElementById('coord-y');
    if (!xEl || !yEl || !camState.target) return;
    xEl.innerText = Math.round(camState.target.x + 1000);
    yEl.innerText = Math.round(camState.target.z + 500);
}

function setupCameraControls() {
    const container = document.getElementById('map-container');
    if (container.dataset.cameraBound) return;
    container.dataset.cameraBound = '1';
    let activePointerId = null;

    container.addEventListener('pointerdown', (e) => {
        camState.dragging = true; camState.moved = false;
        camState.lastX = e.clientX; camState.lastY = e.clientY;
        activePointerId = e.pointerId;
        container.classList.add('grabbing');
    });
    document.addEventListener('pointermove', (e) => {
        if (!camState.dragging || e.pointerId !== activePointerId) return;
        const dx = e.clientX - camState.lastX, dy = e.clientY - camState.lastY;
        if (Math.abs(dx) > 3 || Math.abs(dy) > 3) camState.moved = true;
        camState.lastX = e.clientX; camState.lastY = e.clientY;
        camera.panBy(dx, dy);
    });
    const endDrag = (e) => {
        if (e && e.pointerId !== undefined && e.pointerId !== activePointerId) return;
        camState.dragging = false; container.classList.remove('grabbing'); activePointerId = null;
    };
    document.addEventListener('pointerup', (e) => { endDrag(e); handleContainerClick(e); });
    document.addEventListener('pointercancel', endDrag);

    container.addEventListener('wheel', (e) => { e.preventDefault(); camera.zoomBy(e.deltaY < 0 ? 1.12 : 0.89); }, { passive: false });

    let pinchStartDist = null, pinchStartZoomDist = 300;
    container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            pinchStartDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            pinchStartZoomDist = camState.distance;
        }
    }, { passive: true });
    container.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && pinchStartDist) {
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            camState.distance = Math.min(camState.maxDist, Math.max(camState.minDist, pinchStartZoomDist / (dist / pinchStartDist)));
            updateCameraPosition();
        }
    }, { passive: true });
}

function screenToGroundPoint(clientX, clientY) {
    const rect = document.getElementById('map-container').getBoundingClientRect();
    mouseNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
    mouseNDC.y = -((clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera3d);
    const hit = raycaster.intersectObject(groundMesh)[0];
    return hit ? hit.point : null;
}

function handleContainerClick(e) {
    if (!mapEngineReady || camState.moved) return;
    const container = document.getElementById('map-container');
    const rect = container.getBoundingClientRect();
    if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) return;

    if (basePlacementMode) {
        const p = screenToGroundPoint(e.clientX, e.clientY);
        if (p) { socket.emit('buildBase', { x: p.x, z: p.z }); basePlacementMode = false; }
        return;
    }

    mouseNDC.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouseNDC.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouseNDC, camera3d);
    const hits = raycaster.intersectObjects(entitiesGroup.children, true);
    for (const hit of hits) {
        let obj = hit.object;
        while (obj && !obj.userData.kind) obj = obj.parent;
        if (obj && obj.userData.kind) { dispatchEntityClick(obj.userData.kind, obj.userData.ref, e.clientX, e.clientY); return; }
    }
}

function dispatchEntityClick(kind, ref, clientX, clientY) {
    if (kind === 'city') {
        const c = ref;
        const isOwner = c.owner === currentPlayer.username;
        showRadialMenu(clientX, clientY, [
            { icon: '🔍', label: 'Detay', action: () => showCityPopup(c.id) },
            { icon: isOwner ? '🛡️' : '⚔️', label: isOwner ? 'Savunma' : 'Saldır', action: () => {
                selectedCityId = c.id; selectedMineId = null; selectedBossId = null;
                isOwner ? openDeployModal() : openAttackModal();
            } }
        ]);
    } else if (kind === 'mine') {
        const m = ref;
        const isOwner = m.owner === currentPlayer.username;
        const actions = [{ icon: '🔍', label: 'Detay', action: () => showMinePopup(m.id) }];
        if (!isOwner) actions.push({ icon: '⛏️', label: 'İşgal Et', action: () => { selectedMineId = m.id; selectedCityId = null; selectedBossId = null; openAttackModal('mine'); } });
        showRadialMenu(clientX, clientY, actions);
    } else if (kind === 'boss') {
        const b = ref;
        const actions = [{ icon: '🔍', label: 'Detay', action: () => showBossPopup(b.id) }];
        if (!b.defeated) actions.push({ icon: '👹', label: 'Saldır', action: () => { selectedBossId = b.id; selectedCityId = null; selectedMineId = null; openAttackModal('boss'); } });
        showRadialMenu(clientX, clientY, actions);
    }
}

// ---------- Statik nesneler: gerçek worldData şehirleri / madenleri / bosslar / oyuncu üssü ----------
function makeLabel(text, focal) {
    const div = document.createElement('div');
    div.className = 'iso-label' + (focal ? ' focal' : '');
    div.textContent = text;
    return new CSS2DObject(div);
}

function renderStaticEntities() {
    entitiesGroup.clear();
    if (!worldData) return;

    Object.values(worldData.cities).forEach(c => {
        const { wx, wz } = latLngToWorld(c.lat, c.lng);
        const isCap = c.type === 'capital';
        let group;
        if (isCap) group = createCapitalGroup({});
        else group = createBuildingGroup({ label: c.name, capital: false });
        group.position.set(wx, 0, wz);
        group.userData.kind = 'city'; group.userData.ref = c;
        const label = makeLabel((isCap ? '👑 ' : '') + c.name, isCap);
        label.position.set(0, group.userData.topY, 0);
        group.add(label);
        entitiesGroup.add(group);
    });

    Object.values(worldData.mines || {}).forEach(m => {
        const { wx, wz } = latLngToWorld(m.lat, m.lng);
        const group = createBuildingGroup({ label: m.name, family: 'industrial' });
        group.scale.setScalar(0.72);
        group.position.set(wx, 0, wz);
        group.userData.kind = 'mine'; group.userData.ref = m;
        const label = makeLabel((m.type === 'gold' ? '🟡 ' : '⚙️ ') + m.name, false);
        label.position.set(0, group.userData.topY * 0.72, 0);
        group.add(label);
        entitiesGroup.add(group);
    });

    Object.values(worldData.bosses || {}).forEach(b => {
        const { wx, wz } = latLngToWorld(b.lat, b.lng);
        const group = createBuildingGroup({ label: b.beast, family: 'tower', danger: true });
        group.scale.setScalar(0.8);
        group.position.set(wx, 0, wz);
        group.userData.kind = 'boss'; group.userData.ref = b;
        const label = makeLabel((b.defeated ? '💀 ' : '👹 ') + b.beast.split(' ')[0], false);
        label.position.set(0, group.userData.topY * 0.8, 0);
        group.add(label);
        entitiesGroup.add(group);
    });

    if (currentPlayer.base) {
        const { wx, wz } = xzToWorld(currentPlayer.base.x, currentPlayer.base.z);
        const group = createHouseGroup({ label: 'Ana Üssüm', highlight: true });
        group.position.set(wx, 0, wz);
        const label = makeLabel('🚩 Ana Üssüm', true);
        label.position.set(0, group.userData.topY, 0);
        group.add(label);
        entitiesGroup.add(group);
    }
}

// worldData nesnelerinin kapladığı grid hücrelerini işaretle: dekoratif dolgu bunlarla çakışmasın
function computeOccupiedCells() {
    const occ = new Set();
    const mark = (wx, wz) => {
        const gx = Math.round(wx / GRID), gz = Math.round(wz / GRID);
        for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) occ.add((gx + dx) + ',' + (gz + dz));
    };
    if (worldData) {
        Object.values(worldData.cities).forEach(c => { const { wx, wz } = latLngToWorld(c.lat, c.lng); mark(wx, wz); });
        Object.values(worldData.mines || {}).forEach(m => { const { wx, wz } = latLngToWorld(m.lat, m.lng); mark(wx, wz); });
        Object.values(worldData.bosses || {}).forEach(b => { const { wx, wz } = latLngToWorld(b.lat, b.lng); mark(wx, wz); });
    }
    if (currentPlayer && currentPlayer.base) mark(currentPlayer.base.x, currentPlayer.base.z);
    return occ;
}

// ---------- Dinamik şehir dolgusu: kameranın etrafında yoğun, organik şehir kalabalığı ----------
function scheduleDynamicRefresh() {
    if (!camState.target) return;
    const cx = Math.round(camState.target.x / GRID), cz = Math.round(camState.target.z / GRID);
    const key = cx + ',' + cz;
    if (key === lastDynCell) return;
    lastDynCell = key;
    requestAnimationFrame(() => refreshDynamicContent(cx, cz));
}

const propKinds = ['car', 'car', 'truck', 'container', 'trash', 'lamp', 'pole', 'barrier', 'sign', 'pallet', 'tree'];

function refreshDynamicContent(cx, cz) {
    if (!dynamicGroup) return;
    dynamicGroup.clear();
    const occ = computeOccupiedCells();
    const centerDist = 0; // odak mesafesi hesaplaması için merkez (0,0) kabul edilir
    for (let gx = cx - DYN_RADIUS; gx <= cx + DYN_RADIUS; gx++) {
        for (let gz = cz - DYN_RADIUS; gz <= cz + DYN_RADIUS; gz++) {
            const cellKey = gx + ',' + gz;
            if (occ.has(cellKey)) continue;
            const wx = gx * GRID, wz = gz * GRID;
            const seed = Math.abs(gx * 928371 + gz * 12923);
            const noiseA = Math.sin(gx * 0.62 + gz * 0.31) + Math.cos(gx * 0.19 - gz * 0.54);
            const noiseB = Math.sin(gx * 1.7 + gz * 2.3 + gx * gz * 0.05) * 0.5;
            const jitter = rand01(gx * 12.9898 + gz * 78.233);
            const density = (noiseA + noiseB + jitter * 1.4) / 4;

            // merkeze (ana odak) yakınlık: uzak bölgelerde yoğunluk ve detay azaltılır (görsel hiyerarşi)
            const distFromFocus = Math.hypot(wx, wz);
            const farFactor = Math.max(0, 1 - distFromFocus / 900);

            if (density > -0.02 && jitter < 0.42) {
                const variant = familyForSeed(seed);
                const group = createBuildingGroup({ label: 'deco' + cellKey, family: variant, seed });
                const scaleDown = 0.55 + rand01(seed + 3) * 0.35;
                group.scale.setScalar(scaleDown);
                group.position.set(wx, 0, wz);
                // uzak binalar: soluk, düşük kontrast (renk tonu griye kaydırılır) -- 2D'ye dönüşmeden derinlik hissi
                if (farFactor < 0.7) {
                    group.traverse(o => { if (o.isMesh && o.material && o.material.color) { /* paylaşımlı materyal - klonlamadan kaçın, sadece opacity ile derinlik veriyoruz */ } });
                }
                dynamicGroup.add(group);
            } else if (jitter > 0.55 && jitter < 0.62) {
                const tree = createProp('tree', seed);
                tree.position.set(wx, 0, wz);
                dynamicGroup.add(tree);
            } else if (jitter >= 0.62) {
                const kindIdx = Math.floor(rand01(seed + 11) * propKinds.length);
                const prop = createProp(propKinds[kindIdx], seed + 11);
                prop.position.set(wx + (rand01(seed + 2) - 0.5) * GRID * 0.5, 0, wz + (rand01(seed + 5) - 0.5) * GRID * 0.5);
                dynamicGroup.add(prop);
            }
        }
    }
}

function renderMap() {
    (async () => {
        await threeReadyPromise;
        if (!THREE) return;
        if (!mapEngineReady) initMapEngine();
        if (!worldData) return;
        renderStaticEntities();
        lastDynCell = null;
        scheduleDynamicRefresh();
    })();
}

function showRadialMenu(screenX, screenY, actions) {
    const menu = document.getElementById('radial-menu');
    if (!menu) return;
    menu.innerHTML = '';
    const radius = 58;
    actions.forEach((a, i) => {
        const spread = actions.length > 1 ? 50 : 0;
        const angle = (-90 + (i - (actions.length - 1) / 2) * spread) * Math.PI / 180;
        const bx = screenX + Math.cos(angle) * radius, by = screenY + Math.sin(angle) * radius;
        const btn = document.createElement('div');
        btn.className = 'radial-btn';
        btn.style.left = bx + 'px'; btn.style.top = by + 'px';
        btn.innerHTML = a.icon + `<span class="radial-btn-label">${a.label}</span>`;
        btn.onclick = (e) => { e.stopPropagation(); hideRadialMenu(); a.action(); };
        menu.appendChild(btn);
    });
    menu.classList.add('active');
}
function hideRadialMenu() {
    const menu = document.getElementById('radial-menu');
    if (menu) { menu.classList.remove('active'); menu.innerHTML = ''; }
}
document.addEventListener('pointerdown', (e) => { if (!e.target.closest('.radial-btn')) hideRadialMenu(); });

// ---------- Savaş animasyonu: 3D dünya koordinatları arasında CSS2D emoji-sprite ile ----------
socket.on('battleAnimation', (d) => {
    (async () => {
        await threeReadyPromise;
        if (!THREE || !mapEngineReady || !worldData) return;
        const target = worldData.cities[d.cityId] || worldData.bosses?.[d.cityId] || worldData.mines?.[d.cityId];
        if (!target) return;

        const start = currentPlayer.base ? xzToWorld(currentPlayer.base.x, currentPlayer.base.z) : { wx: 0, wz: 0 };
        const end = (target.lat !== undefined) ? latLngToWorld(target.lat, target.lng) : xzToWorld(target.x, target.z);

        const marchDiv = document.createElement('div'); marchDiv.className = 'fx-icon'; marchDiv.textContent = '⚔️';
        marchDiv.style.color = '#' + (d.attackerColor || 0xff6b00).toString(16).padStart(6, '0');
        const marchObj = new CSS2DObject(marchDiv);
        marchObj.position.set(start.wx, 6, start.wz);
        scene.add(marchObj);

        const t0 = performance.now(), dur = 1000;
        function tick(now) {
            const p = Math.min(1, (now - t0) / dur);
            marchObj.position.set(start.wx + (end.wx - start.wx) * p, 6, start.wz + (end.wz - start.wz) * p);
            if (p < 1) requestAnimationFrame(tick);
            else finishBattle();
        }
        requestAnimationFrame(tick);

        function finishBattle() {
            scene.remove(marchObj);
            playSound('explosion');

            const boomDiv = document.createElement('div'); boomDiv.className = 'fx-boom'; boomDiv.textContent = '💥';
            const boomObj = new CSS2DObject(boomDiv);
            boomObj.position.set(end.wx, 8, end.wz);
            scene.add(boomObj);

            const txtDiv = document.createElement('div'); txtDiv.className = 'fx-text'; txtDiv.textContent = d.result.attackerWins ? 'Zafer!' : 'Yenilgi!';
            txtDiv.style.color = d.result.attackerWins ? 'var(--green)' : 'var(--red)';
            const txtObj = new CSS2DObject(txtDiv);
            txtObj.position.set(end.wx, 14, end.wz);
            scene.add(txtObj);

            setTimeout(() => { boomDiv.style.opacity = '0'; boomDiv.style.transform = 'translate(-50%,-50%) scale(2)'; txtDiv.style.opacity = '0'; }, 100);
            setTimeout(() => { scene.remove(boomObj); scene.remove(txtObj); }, 1000);
        }
    })();
});

socket.on('toast', (d) => showToast(d.type, d.msg));

function showToast(type, msg) { if(type==='success'||type==='victory')playSound('success'); if(type==='defeat'||type==='error')playSound('error'); const c=document.getElementById('toast-container'); const t=document.createElement('div'); t.className=`toast ${type}`; t.innerText=msg; c.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(-20px)';setTimeout(()=>t.remove(),300);},3000); }
